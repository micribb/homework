name: Build StepCam APK

on:
  push:
    branches: [main, master, stepcam]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk StepCam.apk

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepCam-apk
          path: StepCam.apk

      - name: Publish to the "latest" release (easy download on the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StepCam.apk \
            --title "StepCam — latest build" \
            --notes "Open this page on the Moto G Power and tap StepCam.apk to download and install." \
            --target "${GITHUB_SHA}"
